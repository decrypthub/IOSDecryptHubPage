<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IOSDecryptHub</title>
<style>
:root { --bg: #0d0d0d; --surface: #1a1a1e; --text: #e8e8e8; --dim: #999; --accent: #4fc3f7; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding: 16px; line-height: 1.6; }
h1 { font-size: 22px; margin-bottom: 4px; }
.subtitle { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
.card { background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
a.site { display: block; color: var(--accent); font-size: 15px; font-weight: 600; text-decoration: none; }
a.site:hover { text-decoration: underline; }
.meta { display: grid; grid-template-columns: 80px 1fr; gap: 6px 12px; font-size: 13px; }
.meta dt { color: var(--dim); }
</style>
</head>
<body>
<h1>IOSDecryptHub</h1>
<p class="subtitle">v1.24.7</p>

<div class="card">
<a class="site" href="https://ios.decrypthub.com">ios.decrypthub.com →</a>
</div>

<div class="card">
<dl class="meta">
<dt>架构</dt><dd>arm64 / arm64e (rootless / roothide)</dd>
<dt>最低系统</dt><dd>iOS 14.0</dd>
</dl>
</div>
</body>
</html>
